<!DOCTYPE html>
<html lang="en">

<head>
	<title>Personality Quiz Starter Code</title>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- import the webpage's stylesheet -->
	<link rel="stylesheet" href="/style.css">

	<!-- import the webpage's javascript file -->
	<script src="/script.js" defer>

	</script>
</head>

<body>

	<header>
		<h1>Seasons Personality Quiz!</h1>
		<p>Take the test below to see if you're more of a summer or winter person.</p>
	</header>

	<main>

		<h2>What is your favorite activity?</h2>
		<div class="question">

			<div class="answer-choice">
				<img src="assets/summer_activity.jpg" alt="Two young children wearing colorful sunglasses happily playing and splashing in a swimming pool while floating on inflatable rings.">
        <br>
        <button id="q1a1">Swimming</button>
      </div>

      <div class="answer-choice">
        <img src="assets/winter_activity.jpg" alt="A person wearing a green jacket, helmet, and ski goggles skiing down a snowy slope, carving a turn and kicking up a spray of fresh snow.">
        <br>
        <button id="q1a2">Skiing</button>
      </div>

    </div> 
    
    <h2>What would you rather drink?</h2>
    <div class="question">

      <div class="answer-choice">
        <img src="assets/summer_drink.jpg" alt="A clear glass filled with a light-colored cold drink, ice cubes, and a sprig of fresh rosemary, garnished with a lemon slice on the rim and set on a stone surface next to squeezed lemon halves.">
        <br>
        <button id="q2a1">Lemonade</button>
      </div>

      <div class="answer-choice">
        <img src="assets/winter_drink.jpg" alt="A mug of hot chocolate topped with marshmallows sitting on a wooden tray alongside chocolates and a spoon, set in front of a warm, roaring fireplace.">
        <br>
        <button id="q2a2">Hot Chocolate</button>
      </div>

    </div> 
    
    <h2>Where is your ideal vacation home?</h2>
    <div class="question">

      <div class="answer-choice">
        <img src="assets/summer_home.jpg" alt="View from a covered wooden beach house deck featuring two blue lounge chairs looking out toward a wooden boardwalk, sandy dunes, and the sunny ocean under a clear blue sky.">
        <br>
        <button id="q3a1">A beach house overlooking the Pacific</button>
      </div>

      <div class="answer-choice">
        <img src="assets/winter_home.jpg" alt="A snow-covered wooden cabin illuminated with warm interior lights, situated next to a partially frozen lake reflecting the building, evergreen trees, and towering snowy mountains under a cool blue winter sky.">
        <br>
        <button id="q3a2">A snowy mountain cabin in the Alps</button>
      </div>

    </div> 

    <h2 id="result">You are a...</h2>
    
    <button id="restart">Restart</button>
    
  </main>
  </body>
</html>
